name: Setup
description: 'Setup JS workflow, install dependencies and cache them'
author: 'swapkit-dev'

inputs:
  npm-token:
    description: 'NPM token for private @swapkit-dev packages'
    required: true

runs:
  using: 'composite'
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        registry-url: 'https://registry.npmjs.org'

    - name: Install packages
      shell: bash
      env:
        NPM_TOKEN: ${{ inputs.npm-token }}
      run: bun install
