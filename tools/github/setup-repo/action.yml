name: Setup
description: 'Setup JS workflow, install dependencies and cache them'
author: 'swapkit'

inputs:
  npm-token:
    description: 'NPM token for publishing or private package installs'
    required: false

runs:
  using: 'composite'
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        registry-url: 'https://registry.npmjs.org'

    - name: Configure npm auth
      if: inputs.npm-token != ''
      shell: bash
      run: echo "//registry.npmjs.org/:_authToken=${{ inputs.npm-token }}" >> .npmrc

    - name: Install packages
      shell: bash
      run: bun install
